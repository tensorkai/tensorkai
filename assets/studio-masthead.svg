<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">TENSORKAI — Code, circuits, canvas</title>
  <desc id="desc">A static studio masthead for Benedict Fusin. Bold cream typography meets an orange circuit and contour drawing. From an idea to something that works.</desc>
