<title id="title">Tech stack / from model to physical world</title><desc id="desc">Intelligence: Python, PyTorch, TensorFlow, Hugging Face, LangChain, Ollama. Interfaces: TypeScript, JavaScript, React, Next.js, Vue, Tailwind CSS, Flutter, Dart. Backend: Node.js, FastAPI, NestJS, Spring, PostgreSQL, MongoDB, MySQL. Hardware: C++, NodeMCU, MATLAB.</desc>
