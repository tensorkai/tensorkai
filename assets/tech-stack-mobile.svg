er / Dart</text><rect x="24" y="548" width="552" height="200" fill="#1d3630" rx="8"/><rect x="24" y="568" width="3" height="35" fill="#c9dd9c" /><text x="48" y="580" font-size="15" fill="#c9dd9c" font-family="'Courier New',monospace" letter-spacing="1.3" >03 / BACKEND &amp; DATA</text><path d="M0 6Q20 -6 40 6V31Q20 43 0 31Z M0 6Q20 18 40 6 M0 18Q20 30 40 18" transform="translate(510 567)" fill="none" stroke="#c9dd9c" stroke-width="1.8" stroke-linejoin="round"/><text x="48" y="627" font-size="30" fill="#f3eddb" font-weight="700" letter-spacing="-.8">APIs. Data. Connection.</text><text x="48" y="656" font-size="17" fill="#b4c3b6" >Requests → working systems</text><line x1="48" y1="674" x2="552" y2="674" stroke="#40594f" /><text x="48" y="701" font-size="18" fill="#f3eddb" >Node.js / FastAPI / NestJS / Spring</text><text x="48" y="728" font-size="18" fill="#f3eddb" >PostgreSQL / MongoDB / MySQL</text><rect x="24" y="766" width="552" height="200" fill="#1d3630" rx="8"/><rect x="24" y="786" width="3" height="35" fill="#ed8959" /><text x="48" y="798" font-size="15" fill="#ed8959" font-family="'Courier New',monospace" letter-spacing="1.3" >04 / HARDWARE &amp; SIMULATION</text><path d="M7 7H33V33H7Z M14 0V7 M26 0V7 M14 33V40 M26 33V40 M0 14H7 M0 26H7 M33 14H40 M33 26H40" transform="translate(510 785)" fill="none" stroke="#ed8959" stroke-width="1.8" stroke-linejoin="round"/><text x="48" y="845" font-size="29" fill="#f3eddb" font-weight="700" letter-spacing="-.8">C++ + NodeMCU + MATLAB</text><text x="48" y="874" font-size="17" fill="#b4c3b6" >Code → the physical world</text><line x1="48" y1="892" x2="552" y2="892" stroke="#40594f" /><text x="48" y="919" font-size="18" fill="#f3eddb" >Embedded systems / IoT automation</text><text x="48" y="946" font-size="18" fill="#f3eddb" >Prototypes that leave the screen</text><text x="32" y="1000" font-size="15" fill="#b4c3b6" font-family="'Courier New',monospace" letter-spacing="1.3" >MODEL → INTERFACE → SYSTEM → REAL WORLD</text></svg>
