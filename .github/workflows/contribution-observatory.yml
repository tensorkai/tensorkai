name: Update contribution summary
on:
  schedule:
    # Hourly, away from the busy start of the hour. GitHub may delay runs.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/activity.mjs'
      - 'scripts/update-activity.mjs'
      - 'scripts/activity.test.mjs'
      - 'scripts/profile-art.mjs'
      - '.github/workflows/contribution-observatory.yml'

permissions:
  contents: write

concurrency:
  group: contribution-observatory
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Refresh and publish the README summary
        env:
          PROFILE_USERNAME: tensorkai
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Regenerate on current main in this disposable runner instead of
            # rebasing generated files over somebody else's README edits.
            git fetch origin main
            git checkout --detach origin/main
            node --test scripts/activity.test.mjs
            node scripts/update-activity.mjs
            git add README.md data/contributions.json assets/contribution-observatory.svg assets/contribution-observatory-mobile.svg
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: refresh contribution summary"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "Could not publish the summary after three attempts." >&2
          exit 1
